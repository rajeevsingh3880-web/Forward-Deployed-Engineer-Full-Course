<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomato Support</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">
      <div class="tomato-icon">🍅</div>
      <div>
        <h1>Tomato Support</h1>
        <p>AI-powered assistance</p>
      </div>
    </div>

    <div class="status">
      <span></span> Online
    </div>
  </header>

  <main class="chat-container">

    <div class="welcome">
      <div class="big-tomato">🍅</div>
      <h2>Welcome to Tomato Support</h2>
      <p>
        Ask me anything about tomatoes, farming, diseases,
        cultivation, or tomato care.
      </p>
    </div>

    <div id="chatBox" class="chat-box"></div>

  </main>

  <div class="input-area">
    <div class="input-wrapper">
            <textarea
                    id="messageInput"
                    placeholder="Ask Tomato Support something..."
            ></textarea>

      <button id="sendButton" type="button">
        <span>➤</span>
      </button>

      <div id="chatBox" class="chat-Box"></div>
    </div>

    <p class="footer-text">
      Tomato Support • Powered by Spring Boot
    </p>
  </div>

</div>

<script src="/script.js"></script>

</body>
</html>
